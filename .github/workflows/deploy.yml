name: Build, Push, and Deploy Warzonee

on:
  push:
    branches: [ "main" ]

# Prevent overlapping deployments from racing on Docker Swarm Raft state ("update out of sequence")
concurrency:
  group: deploy-warzone-stack
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compute Build Version
        id: version
        run: echo "app_version=v1.0.${{ github.run_number }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/adilaljasem/warzone:latest
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}

      # 1. Copy the updated warzone-stack.yml to the server
      - name: Copy Stack File to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          source: "warzone-stack.yml"
          target: "/home/adil/"

      # 2. SSH in, pull the latest image, and redeploy the stack
      - name: Deploy to Docker Swarm
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 2222
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /home/adil/

            # Ensure external overlay network exists before deploying
            docker network inspect traefik_public >/dev/null 2>&1 || docker network create --driver=overlay --attachable traefik_public

            # Use a temporary DOCKER_CONFIG so existing server registry logins are untouched
            DOCKER_CFG=$(mktemp -d)
            trap 'rm -rf "$DOCKER_CFG"' EXIT
            echo "$GHCR_TOKEN" | DOCKER_CONFIG="$DOCKER_CFG" docker login ghcr.io -u "$GHCR_USER" --password-stdin

            # Explicitly pull the latest image onto linux1 so Swarm has the newest digest
            DOCKER_CONFIG="$DOCKER_CFG" docker pull ghcr.io/adilaljasem/warzone:latest

            # Deploy the stack with retry in case Swarm Raft state between managers is mid-sync ("update out of sequence")
            deployed=0
            for i in 1 2 3; do
              if DOCKER_CONFIG="$DOCKER_CFG" docker stack deploy -c warzone-stack.yml warzone_stack --with-registry-auth; then
                deployed=1
                break
              fi
              echo "Swarm update out of sequence, retrying in 5s (attempt $i/3)..."
              sleep 5
            done
            [ "$deployed" -eq 1 ]
