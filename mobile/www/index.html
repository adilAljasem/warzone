<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Warzonee</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 35%, #19382e, #0c1b17);
      color: #f3ecda;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid; place-items: center; text-align: center;
      padding: 20px;
    }
    .card {
      max-width: 380px; padding: 24px 20px; border-radius: 16px;
      background: rgba(16, 36, 30, 0.92);
      border: 1px solid rgba(227, 193, 122, 0.42);
      display: grid; gap: 12px;
    }
    h1 { font-size: 22px; color: #f5db9f; letter-spacing: 2px; }
    p { font-size: 13px; color: #c7d5bf; line-height: 1.55; }
    button {
      padding: 11px 18px; border-radius: 9px; font-weight: 700; font-size: 14px;
      border: 1px solid #f6d898; background: linear-gradient(#d8b875, #b38c45);
      color: #1f3126; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>WARZONEE</h1>
    <p>تعذّر الاتصال بسيرفر اللعبة. تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.<br/><small style="opacity:.8">Unable to reach warzonee.com. Check your connection and retry.</small></p>
    <button type="button" onclick="window.location.href='https://warzonee.com'">إعادة المحاولة · Retry</button>
  </div>
</body>
</html>
