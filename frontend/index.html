<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><meta name="theme-color" content="#182a25"/><title>Warzone — Sunmeadow</title></head>
<body>
<svg class="svg-defs" xmlns="http://www.w3.org/2000/svg"><defs>
    <symbol id="i-wood" viewBox="0 0 24 24"><path d="M11 22v-8h3v8" fill="#977049"/><path d="M12 2 3 14h5l-3 4h15l-3-4h4Z" fill="#78a66b"/><path d="m12 2 0 16H5l3-4H3Z" fill="#9ec87f"/></symbol>
    <symbol id="i-iron" viewBox="0 0 24 24"><path d="m5 6 12-2 5 12-13 4-7-7Z" fill="#92a6b6"/><path d="m5 6 9 4 8 6-13 4-7-7Z" fill="#b7c5cd"/><path d="m5 6 9 4 3-6Z" fill="#e5edf0"/></symbol>
    <symbol id="i-stone" viewBox="0 0 24 24"><path d="m2 18 5-11 9-3 7 14-10 4Z" fill="#a29e8a"/><path d="m7 7 6 7 3-10Z" fill="#d5d0b9"/><path d="m2 18 11-4v8Z" fill="#bbb5a0"/></symbol>
    <symbol id="i-wheat" viewBox="0 0 24 24"><path d="m7 23 8-20" stroke="#ad8b42" stroke-width="2"/><g fill="#e8b64d"><ellipse cx="12" cy="6" rx="2" ry="4" transform="rotate(-30 12 6)"/><ellipse cx="18" cy="8" rx="2" ry="4" transform="rotate(50 18 8)"/><ellipse cx="9" cy="12" rx="2" ry="4" transform="rotate(-30 9 12)"/><ellipse cx="15" cy="15" rx="2" ry="4" transform="rotate(50 15 15)"/></g></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M5 2h14v20H5Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7h8M8 11h8M8 15h5" stroke="currentColor" stroke-width="1.6"/><path d="m13 19 2-2 2 2-2 2Z" fill="#e1bd74"/></symbol>
    <symbol id="i-sword" viewBox="0 0 24 24"><path d="m8 16 12-14 1 6L11 18Z" fill="#c9dce1"/><path d="m4 14 9 7M8 18l-5 5" stroke="#d5b567" stroke-width="3"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 2 9 4v7c-1 5-6 8-9 10-3-2-8-5-9-10V6Z" fill="#d8b469"/><path d="m12 5 6 3v5c-1 3-4 6-6 7Z" fill="#f2d79b"/></symbol>
    <symbol id="i-map" viewBox="0 0 24 24"><path d="m2 5 6-3 8 3 6-3v17l-6 3-8-3-6 3Z" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 2v17M16 5v17" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="m3 10 9-8 9 8v12H3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9 22v-8h6v8" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  </defs></svg>
<div id="game" class="game-shell">
  <div id="world-scene" class="scene"><div id="map"></div></div>
  <div class="vignette" aria-hidden="true"></div>
  <header class="hud glass"><button id="realm-menu" class="brand" aria-label="Realm menu"><svg><use href="#i-shield"/></svg><span>WARZONE<small>SUNMEADOW</small></span></button><div id="resources" class="resources"></div><button id="muster-hud" class="muster-hud" aria-label="View total army and food consumption" hidden></button><div id="language-picker" class="language-control" data-no-translate></div><div class="match-status"><strong id="match-clock">A new adventure</strong><span id="connection" role="status">Connecting</span><button id="reconnect" hidden>Reconnect</button></div></header>
  <div class="scene-heading"><span id="scene-eyebrow">THE GREEN FRONTIER</span><h1 id="scene-title">Sunmeadow Valley</h1><p id="scene-hint">Your kingdom awaits.</p></div>
  <button id="village-biome" class="village-biome glass" hidden></button>
  <section id="important-alerts" class="important-alerts" aria-live="assertive" hidden></section>

  <div id="world-tools" class="world-tools"><button id="zoom-in" aria-label="Zoom in">+</button><button id="zoom-out" aria-label="Zoom out">−</button><button id="map-home" aria-label="Fit world map">⌖</button><button id="map-biomes" aria-label="Show biome boundaries" title="Show biome boundaries" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m3 5 6-2 6 3 6-2v15l-6 2-6-3-6 2Z"/><path d="M9 3v15M15 6v15" stroke-dasharray="2 2"/></svg></button></div>
  <section id="world-chat" class="world-chat" aria-label="Realm chat" hidden><button id="chat-toggle" class="chat-toggle" aria-expanded="true" aria-controls="chat-content"><span>Realm chat</span><span aria-hidden="true">−</span></button><div id="chat-content"><div id="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div><form id="chat-form"><input id="chat-input" maxlength="300" autocomplete="off" placeholder="Write a message" aria-label="Chat message"/><button type="submit" class="chat-send">Send</button></form></div></section>
  <aside id="drawer" class="drawer glass" aria-label="Selection details" hidden><div class="drawer-heading"><div><span id="drawer-kicker"></span><h2 id="drawer-title"></h2></div><button id="close-drawer" class="icon-button" aria-label="Close panel">×</button></div><div id="drawer-tabs" class="tabs"></div><div id="drawer-body"></div></aside>
  <div id="notice" class="toast glass" role="status" hidden></div>
  <div id="work-queue" class="work-queue"></div>
  <section id="command-deck" class="command-deck" hidden><nav id="dock" class="dock glass" aria-label="Game controls"><button id="view-buildings"><svg><use href="#i-home"/></svg><span>Buildings</span></button><button id="view-world"><svg><use href="#i-map"/></svg><span>World map</span></button><span class="dock-divider"></span><button id="view-armies"><svg><use href="#i-sword"/></svg><span>Armies <b id="army-count">0</b></span></button><button id="view-reports"><svg><use href="#i-report"/></svg><span>Reports <b id="report-count" hidden></b></span></button><button id="view-standings"><svg><use href="#i-shield"/></svg><span>Kingdoms</span></button></nav><div class="building-shelf glass"><div id="building-strip" class="building-strip" aria-label="Village buildings"></div></div></section>
  <div id="welcome" class="welcome-overlay"><section class="welcome-card glass"><div class="welcome-emblem"><svg><use href="#i-shield"/></svg></div><span class="eyebrow">A KINGDOM OF YOUR OWN</span><h1>WARZONE</h1><p>Build your village. Lead your people.<br/>Write your story in the valley.</p><label>Commander<input id="player-name" value="Commander" maxlength="32"/></label><div id="tribe-picker"></div><button id="play-solo" class="primary wide">Begin your adventure <span>→</span></button><button id="multiplayer" class="quiet wide">Play with friends</button><small>Local realm · Seven AI neighbors · Crown Keep at 30:00</small></section></div>
</div><script type="module" src="/src/main.ts"></script></body></html>
